# EGFR Atomistic Frustration Pipeline - Configuration
# All numeric parameters and file paths live here; nothing is hardcoded in the code.

paths:
  raw_pdb:        data/raw_pdb
  processed:      data/processed
  ligands:        data/ligands
  params:         data/ligands/params
  results:        results
  checkpoints:    checkpoints
  # Stage 1/4/5 outputs (scripts/01-05) — the current 61-structure candidate source
  candidates_csv:    results/metadata/egfr_ligand_inventory.csv
  prep_summary_csv:  results/preparation_summary.csv
  ligand_status_csv: results/metadata/ligand_parameterization_status.csv

contacts:
  protein_protein_cutoff_A: 10.0   # Cα-Cα cutoff distance (Å)
  ligand_protein_cutoff_A:  10.0   # ligand heavy-atom — Cα cutoff distance (Å)
  seq_sep_min: 4                   # skip contacts with |i-j| < 4 (local backbone)

frustration:
  n_decoys: 50                     # initial prototype; raise to 200-1000 later
  seed: 42
  exclude_fa_rep: true             # Eq.1/2: exclude the fa_rep term
  thresholds:
    minimally_frustrated:  0.78   # F_ij > 0.78 → minimally frustrated
    highly_frustrated:    -1.00   # F_ij < -1.0 → highly frustrated

energy:
  score_function: ref2015

decoy:
  backbone_fixed: true
  relax_cycles: 1                  # reserved; decoy side-chain minimization is a single chi-only MinMover pass

chain_selection:
  default: A                       # which chain to use for multi-chain structures

checkpoint:
  save_every_n_decoys: 50         # save intermediate results at this interval
  format: parquet                  # parquet or pickle

validation:
  pdb_id: 1LYZ                    # lysozyme validation structure
  expected_core_frac_min: 0.5     # at least 50% of core contacts must be minimally frustrated
