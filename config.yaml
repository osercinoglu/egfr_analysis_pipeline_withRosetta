# EGFR Atomistic Frustration Pipeline - Konfigürasyon
# Tüm sayısal parametreler ve dosya yolları burada; kod içinde hardcode edilmez.

paths:
  raw_pdb:        data/raw_pdb
  processed:      data/processed
  ligands:        data/ligands
  params:         data/ligands/params
  results:        results
  checkpoints:    checkpoints
  candidates_csv: results/egfr_final_candidates.csv

contacts:
  protein_protein_cutoff_A: 10.0   # Cα-Cα kesme mesafesi (Å)
  ligand_protein_cutoff_A:  10.0   # ligand heavy-atom — Cα kesme mesafesi (Å)
  seq_sep_min: 4                   # |i-j| < 4 kontakları atla (yerel backbone)

frustration:
  n_decoys: 50                     # başlangıç prototipi; sonra 200-1000'e çıkar
  seed: 42
  exclude_fa_rep: true             # Eq.1/2: fa_rep terimi hariç tutulsun
  thresholds:
    minimally_frustrated:  0.78   # F_ij > 0.78 → minimally frustrated
    highly_frustrated:    -1.00   # F_ij < -1.0 → highly frustrated

energy:
  score_function: ref2015

decoy:
  backbone_fixed: true
  relax_cycles: 1                  # backbone-sabit FastRelax iterasyonu (1 = hızlı)

chain_selection:
  default: A                       # çok zincirli yapılarda hangi zincir kullanılır

checkpoint:
  save_every_n_decoys: 50         # bu sıklıkta ara sonuç kaydet
  format: parquet                  # parquet veya pickle

validation:
  pdb_id: 1LYZ                    # lysozyme validasyon yapısı
  expected_core_frac_min: 0.5     # core kontakların en az %50'si minimally frustrated olmalı
